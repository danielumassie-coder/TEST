<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }

        .game-info {
            background-color: #f5f5f5;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin: 1.5rem 0;
        }

        #guess-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        #guess-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
        }

        .btn-secondary {
            background-color: #28a745;
            color: white;
            margin-left: 0.5rem;
        }

        .btn-secondary:hover {
            background-color: #218838;
        }

        .feedback {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 1rem 0;
            min-height: 1.5rem;
        }

        .feedback.too-low {
            color: #dc3545;
        }

        .feedback.too-high {
            color: #ffc107;
        }

        .feedback.correct {
            color: #28a745;
        }

        .attempts {
            font-size: 1rem;
            color: #666;
            margin-top: 1rem;
        }

        .hidden {
            display: none;
        }

        .celebration {
            font-size: 3rem;
            margin: 1rem 0;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        .difficulty-buttons button {
            flex: 1;
            padding: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎲 Number Guessing Game</h1>
        <p class="subtitle">I'm thinking of a number. Can you guess it?</p>

        <div class="game-info">
            <p><strong>Range:</strong> <span id="range">1 - 100</span></p>
            <p class="attempts">Attempts: <strong id="attempts">0</strong></p>
        </div>

        <div id="game-area">
            <div class="input-group">
                <input type="number" id="guess-input" placeholder="Enter your guess" />
                <button class="btn btn-primary" onclick="makeGuess()">Guess</button>
            </div>

            <div class="feedback" id="feedback"></div>
        </div>

        <div id="win-area" class="hidden">
            <div class="celebration">🎉</div>
            <h2>Congratulations!</h2>
            <p class="feedback correct">You guessed the number!</p>
            <p id="win-message"></p>
            <button class="btn btn-secondary" onclick="resetGame()">Play Again</button>
        </div>

        <div class="difficulty-buttons">
            <button class="btn btn-primary" onclick="setDifficulty(50)">Easy (1-50)</button>
            <button class="btn btn-primary" onclick="setDifficulty(100)">Medium (1-100)</button>
            <button class="btn btn-primary" onclick="setDifficulty(200)">Hard (1-200)</button>
        </div>
    </div>

    <script>
        let secretNumber;
        let attempts;
        let maxNumber = 100;

        function initGame() {
            secretNumber = Math.floor(Math.random() * maxNumber) + 1;
            attempts = 0;
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('feedback').textContent = '';
            document.getElementById('guess-input').value = '';
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('win-area').classList.add('hidden');
            console.log('Secret number:', secretNumber); // For testing
        }

        function setDifficulty(max) {
            maxNumber = max;
            document.getElementById('range').textContent = `1 - ${max}`;
            initGame();
        }

        function makeGuess() {
            const input = document.getElementById('guess-input');
            const guess = parseInt(input.value);
            const feedback = document.getElementById('feedback');

            if (isNaN(guess) || guess < 1 || guess > maxNumber) {
                feedback.textContent = `Please enter a number between 1 and ${maxNumber}!`;
                feedback.className = 'feedback';
                return;
            }

            attempts++;
            document.getElementById('attempts').textContent = attempts;

            if (guess < secretNumber) {
                feedback.textContent = '📉 Too low! Try a higher number.';
                feedback.className = 'feedback too-low';
            } else if (guess > secretNumber) {
                feedback.textContent = '📈 Too high! Try a lower number.';
                feedback.className = 'feedback too-high';
            } else {
                winGame();
            }

            input.value = '';
            input.focus();
        }

        function winGame() {
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('win-area').classList.remove('hidden');

            let message = '';
            if (attempts <= 3) {
                message = 'Amazing! You\'re a guessing master! 🏆';
            } else if (attempts <= 7) {
                message = 'Great job! You found it! 👏';
            } else {
                message = 'You got it! Keep practicing! 💪';
            }

            document.getElementById('win-message').textContent = 
                `You found the number ${secretNumber} in ${attempts} attempts. ${message}`;
        }

        function resetGame() {
            initGame();
        }

        // Allow pressing Enter to submit guess
        document.getElementById('guess-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                makeGuess();
            }
        });

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
