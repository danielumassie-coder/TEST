<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        #task-input {
            flex: 1;
            padding: 0.75rem;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        #task-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-add {
            background-color: #667eea;
            color: white;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            background-color: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
        }

        .task-item:hover {
            background-color: #e8e8e8;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .task-checkbox {
            margin-right: 1rem;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 2rem;
        }

        .stats {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid #ddd;
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 To-Do List</h1>
        
        <div class="input-group">
            <input type="text" id="task-input" placeholder="What needs to be done?" />
            <button class="btn btn-add" onclick="addTask()">Add</button>
        </div>

        <ul class="task-list" id="task-list">
            <!-- Tasks will be added here -->
        </ul>

        <div class="stats">
            <span>Total: <strong id="total-tasks">0</strong></span>
            <span>Completed: <strong id="completed-tasks">0</strong></span>
            <span>Remaining: <strong id="remaining-tasks">0</strong></span>
        </div>
    </div>

    <script>
        let tasks = [];

        function renderTasks() {
            const taskList = document.getElementById('task-list');
            
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">No tasks yet! Add one to get started.</div>';
            } else {
                taskList.innerHTML = tasks.map((task, index) => `
                    <li class="task-item ${task.completed ? 'completed' : ''}">
                        <input type="checkbox" class="task-checkbox" 
                               ${task.completed ? 'checked' : ''} 
                               onchange="toggleTask(${index})">
                        <span class="task-text">${task.text}</span>
                        <button class="btn btn-delete" onclick="deleteTask(${index})">Delete</button>
                    </li>
                `).join('');
            }

            updateStats();
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();

            if (text === '') {
                alert('Please enter a task!');
                return;
            }

            tasks.push({
                text: text,
                completed: false
            });

            input.value = '';
            renderTasks();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const remaining = total - completed;

            document.getElementById('total-tasks').textContent = total;
            document.getElementById('completed-tasks').textContent = completed;
            document.getElementById('remaining-tasks').textContent = remaining;
        }

        // Allow pressing Enter to add task
        document.getElementById('task-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        });

        // Initial render
        renderTasks();
    </script>
</body>
</html>
